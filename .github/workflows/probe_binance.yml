name: Probe Binance reachability

# One-off diagnostic: the crowd-short signal is validated on Binance futures
# positioning data, which returns 451 from the developer's location. GitHub's
# runners are elsewhere, so they may have access the local machine does not.
# If they do, the strategy can run here without any extra infrastructure.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check Binance futures endpoints
        run: |
          echo "--- runner egress IP / region ---"
          curl -s https://ipinfo.io/json | head -20 || true

          echo ""
          echo "--- globalLongShortAccountRatio (the series the signal uses) ---"
          code=$(curl -s -o /tmp/ls.json -w "%{http_code}" \
            "https://fapi.binance.com/futures/data/globalLongShortAccountRatio?symbol=BTCUSDT&period=1h&limit=3")
          echo "HTTP $code"
          head -c 400 /tmp/ls.json; echo

          echo ""
          echo "--- topLongShortAccountRatio ---"
          code2=$(curl -s -o /tmp/top.json -w "%{http_code}" \
            "https://fapi.binance.com/futures/data/topLongShortAccountRatio?symbol=BTCUSDT&period=1h&limit=3")
          echo "HTTP $code2"
          head -c 300 /tmp/top.json; echo

          echo ""
          echo "--- openInterestHist ---"
          code3=$(curl -s -o /tmp/oi.json -w "%{http_code}" \
            "https://fapi.binance.com/futures/data/openInterestHist?symbol=BTCUSDT&period=1h&limit=3")
          echo "HTTP $code3"
          head -c 300 /tmp/oi.json; echo

          echo ""
          if [ "$code" = "200" ]; then
            echo "RESULT: Binance positioning data IS reachable from GitHub Actions."
          else
            echo "RESULT: blocked here too (HTTP $code)."
          fi
